name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-trivial changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Treat documentation and static metadata changes as trivial so we can
          # short-circuit expensive CI checks when they are the only files
          # modified in a pull request. The full list of trivial patterns lives
          # in .github/trivial-paths.yml so all workflows stay in sync.
          filters: .github/trivial-paths.yml

      - name: Decide whether to run CI
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.non_trivial }}" = "true" ]; then
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_ci=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.changes.outputs.run_ci == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.changes.outputs.run_ci == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.run_ci == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.run_ci == 'true'
        run: npm run lint

      - name: Test
        if: needs.changes.outputs.run_ci == 'true'
        env:
          COVERAGE_SKIP_BASE: '1'
        run: npm run test -- --coverage

      - name: Upload coverage summary
        if: needs.changes.outputs.run_ci == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      - name: Build
        if: needs.changes.outputs.run_ci == 'true'
        run: npm run build

      - name: Verify deployment bundle
        if: needs.changes.outputs.run_ci == 'true'
        run: npm run verify:dist

      - name: Upload production bundle
        if: needs.changes.outputs.run_ci == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: CI skipped summary
        if: needs.changes.outputs.run_ci != 'true'
        run: |
          echo "CI build, lint, and test steps skipped because only documentation or metadata files changed."
          echo "CI build, lint, and test steps skipped because only documentation or metadata files changed." >> "$GITHUB_STEP_SUMMARY"

  coverage-comparison:
    needs:
      - changes
      - build-and-test
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download coverage summary
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary

      - name: Compare coverage against base branch
        id: coverage
        continue-on-error: true
        env:
          COVERAGE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          COVERAGE_HEAD_SUMMARY: coverage-summary/coverage-summary.json
          COVERAGE_REPORT_PATH: coverage-report.md
        run: npm run test

      - name: Publish coverage comparison comment
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');

            const reportPath = 'coverage-report.md';
            if (!fs.existsSync(reportPath)) {
              core.warning(`Coverage report not found at ${reportPath}; skipping PR comment.`);
              return;
            }

            const marker = '<!-- coverage-report -->';
            const body = fs.readFileSync(reportPath, 'utf8');
            const fullBody = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (!issue_number) {
              core.warning('No pull request context available; skipping PR comment.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: fullBody,
              });
            }

      - name: Fail if coverage comparison detected regressions
        if: ${{ steps.coverage.outcome == 'failure' }}
        run: |
          echo 'Coverage regression detected.'
          exit 1
